name: user_management_mobile
description: Native Flutter client for the User Management ASP.NET API.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.11.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  dio: ^5.11.1
  flutter_riverpod: ^3.4.3
  go_router: ^17.0.0
  flutter_secure_storage: ^10.0.0
  local_auth: ^3.0.2
  image_picker: ^1.2.4
  share_plus: ^13.3.1
  webview_flutter: ^4.14.1
  path_provider: ^2.1.5
  http_parser: ^4.1.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  fonts:
    - family: General Sans
      fonts:
        - asset: assets/fonts/GeneralSans-400.ttf
          weight: 400
        - asset: assets/fonts/GeneralSans-500.ttf
          weight: 500
        - asset: assets/fonts/GeneralSans-600.ttf
          weight: 600
